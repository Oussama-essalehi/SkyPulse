version: 2

models:
  - name: fct_flights
    description: >
      Reconstructed flights (ADS-B has no native origin/destination): one row per flight,
      with the nearest airport at take-off / landing when it could be identified.
    columns:
      - name: flight_id
        description: "<icao24>-<epoch of first position>"
        data_tests: [unique, not_null]
      - name: icao24
        data_tests: [not_null]
      - name: duration_min
        description: Airborne duration in minutes.
        data_tests:
          - value_between: {arguments: {min_value: 0, max_value: 1440}}
      - name: distance_km
        description: Flown distance (sum of great-circle steps).
      - name: max_altitude_m
        data_tests:
          - value_between: {arguments: {min_value: -500, max_value: 20000}}
      - name: is_complete
        description: Both departure and arrival airports identified.
      - name: airline_icao
        description: ICAO airline designator from the callsign prefix (AFR1234 -> AFR).
      - name: aircraft_typecode
        description: ICAO type designator from the OpenSky aircraft database (A320, B738...).

  - name: fct_traffic_hourly
    description: Distinct aircraft per hour, geographic zone and country of registration.
    columns:
      - name: hour
        data_tests: [not_null]
      - name: zone
        data_tests:
          - accepted_values:
              arguments:
                values: ['Europe', 'North America', 'Central America & Caribbean', 'South America',
                         'Middle East', 'Africa', 'Asia', 'Oceania', 'Arctic', 'Oceans & other']
      - name: aircraft
        data_tests: [not_null]

  - name: fct_airport_activity
    description: Departures and arrivals per airport and hour.
    columns:
      - name: airport_icao
        data_tests: [not_null]
      - name: movements
        data_tests: [not_null]
    data_tests:
      - unique_combination:
          arguments:
            columns: [airport_icao, hour]

  - name: fct_routes
    description: Departure -> arrival airport pairs ranked by number of flights.
    columns:
      - name: route
        data_tests: [unique, not_null]
      - name: flights
        data_tests: [not_null]

  - name: fct_alerts_history
    description: History of anomaly alerts (one row per alert id).
    columns:
      - name: alert_id
        data_tests: [unique, not_null]
      - name: alert_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['squawk_7500', 'squawk_7600', 'squawk_7700', 'rapid_descent',
                         'holding_pattern', 'signal_loss', 'diversion', 'trajectory_outlier']
      - name: severity
        data_tests:
          - accepted_values:
              arguments:
                values: ['info', 'warning', 'critical']

  - name: fct_altitude_profile
    description: Daily distribution of airborne positions per 1000 m altitude band.
    columns:
      - name: altitude_band_m
        data_tests:
          - not_null
          - value_between: {arguments: {min_value: 0, max_value: 20000}}
    data_tests:
      - unique_combination:
          arguments:
            columns: [day, altitude_band_m]

  - name: fct_callsign_routes
    description: Usual arrival airport per (callsign, departure airport).
    data_tests:
      - unique_combination:
          arguments:
            columns: [callsign, departure_airport]
    columns:
      - name: usual_arrival_share
        data_tests:
          - value_between: {arguments: {min_value: 0, max_value: 1}}

  - name: fct_diversions
    description: Flights that landed somewhere else than the usual destination of their callsign.
    columns:
      - name: flight_id
        data_tests: [unique, not_null]

  - name: dim_airports
    description: Airport reference (OurAirports), one row per ICAO code.
    columns:
      - name: airport_icao
        data_tests: [unique, not_null]

  - name: dim_aircraft_registry
    description: >
      OpenSky aircraft database (one row per icao24) with ICAO Doc 8643 type details:
      registration, type, manufacturer, wake category, operator. Empty when the
      database was not downloaded (`make seed` with SKYRADAR_SKIP_AIRCRAFT_DB=1).
    columns:
      - name: icao24
        data_tests: [unique, not_null]
      - name: wake_category
        description: L(ight), M(edium), H(eavy), J (super), L/M.
        data_tests:
          - accepted_values:
              arguments:
                values: ['L', 'M', 'H', 'J', 'L/M']

  - name: dim_aircraft
    description: >
      Aircraft observed by SkyRadar (one row per icao24), with type and operator from
      the OpenSky database and the airline of the latest callsign.
    columns:
      - name: icao24
        data_tests: [unique, not_null]
      - name: airline_icao
        description: Airline of the latest callsign, else the registered operator.
      - name: in_registry
        description: The aircraft is known to the OpenSky aircraft database.

  - name: dim_airlines
    description: Airlines by ICAO designator (OpenFlights, active airlines preferred).
    columns:
      - name: airline_icao
        data_tests: [unique, not_null]

  - name: fct_airline_activity
    description: Distinct aircraft per hour and airline (from the callsign prefix).
    columns:
      - name: hour
        data_tests: [not_null]
      - name: airline_icao
        data_tests: [not_null]
      - name: aircraft
        data_tests:
          - value_between: {arguments: {min_value: 1, max_value: 100000}}
    data_tests:
      - unique_combination:
          arguments:
            columns: [hour, airline_icao]
