[project]
name = "skyradar-orchestration"
version = "0.1.0"
description = "Dagster orchestration of dbt, data quality and ML"
requires-python = ">=3.12,<3.13"
dependencies = [
    "skyradar-ml",
    "dagster>=1.8",
    "dagster-webserver>=1.8",
    "dagster-dbt>=0.24",
    "dagster-postgres>=0.24",
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    "duckdb>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skyradar_orchestration"]
