[project]
name = "skyradar-streaming"
version = "0.1.0"
description = "Stream processors: Parquet lake sink and anomaly detector"
requires-python = ">=3.12,<3.13"
dependencies = [
    "skyradar-common[storage]",
    "prometheus-client>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skyradar_streaming"]
