[project]
name = "skyradar-api"
version = "0.1.0"
description = "Live API: REST + WebSocket over the in-memory aircraft state"
requires-python = ">=3.12,<3.13"
dependencies = [
    "skyradar-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skyradar_api"]
