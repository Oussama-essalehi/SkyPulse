    meta:
      width: 12
      height: 20
      code: "### SkyRadar \u2014 mod\xE8les de ML (suivis dans MLflow)\n\n**ETA**\
        \ : LightGBM corrige l'estimation na\xEFve (distance restante / vitesse sol)\
        \ ; \xE9valuation\nsur les vols les plus r\xE9cents (split temporel par vol).\
        \ **Pr\xE9vision** : Holt-Winters\n(saisonnalit\xE9 24 h) contre une baseline\
        \ saisonni\xE8re na\xEFve. **Isolation Forest** sur les\ncaract\xE9ristiques\
        \ de trajectoire, et **d\xE9routements** (arriv\xE9e diff\xE9rente de la destination\n\
        habituelle du callsign). Les mod\xE8les ne s'entra\xEEnent qu'au-del\xE0 d'un\
        \ seuil d'historique.\n"
