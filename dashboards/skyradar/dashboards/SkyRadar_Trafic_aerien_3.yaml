    meta:
      width: 12
      height: 20
      code: "### SkyRadar \u2014 trafic a\xE9rien mondial (donn\xE9es ADS-B OpenSky)\n\
        \nMarts dbt (Parquet) rafra\xEEchis toutes les heures par Dagster. Les vols\
        \ sont **reconstitu\xE9s**\n\xE0 partir des positions (l'ADS-B ne transporte\
        \ ni origine ni destination) : un vol commence\nau d\xE9collage ou apr\xE8\
        s un trou de plus de 30 min, et ses extr\xE9mit\xE9s sont rattach\xE9es \xE0\
        \nl'a\xE9roport le plus proche quand l'avion est au sol ou sous 1 500 m.\n"
