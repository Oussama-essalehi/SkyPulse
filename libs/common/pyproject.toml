[project]
name = "skyradar-common"
version = "0.1.0"
description = "Shared message schemas, Kafka and storage helpers for SkyRadar services"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "orjson>=3.10",
    "aiokafka[lz4]>=0.11",
]

[project.optional-dependencies]
storage = ["pyarrow>=17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skyradar_common"]
