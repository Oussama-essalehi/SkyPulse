# Option B: streaming anomaly detector on Fly.io (no public service). From the repo root:
#   fly deploy . --config deploy/fly/anomaly-detector.toml --dockerfile streaming/Dockerfile
#   fly secrets set KAFKA_BOOTSTRAP_SERVERS=... KAFKA_SASL_USERNAME=... KAFKA_SASL_PASSWORD=...
app = "skyradar-anomaly"
primary_region = "cdg"

[experimental]
  cmd = ["python", "-m", "skyradar_streaming.anomaly.main"]

[env]
  METRICS_PORT = "9102"
  KAFKA_SECURITY_PROTOCOL = "SASL_SSL"
  KAFKA_SASL_MECHANISM = "SCRAM-SHA-256"
  LOG_FORMAT = "json"

[checks.metrics]
  type = "http"
  port = 9102
  path = "/metrics"
  interval = "30s"
  timeout = "5s"
  grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
