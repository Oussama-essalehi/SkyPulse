# Option A override: `docker compose -f docker-compose.yml -f deploy/compose.prod.yml --profile demo up -d`
# Only Caddy is exposed; every service restarts on failure / reboot.
services:
  caddy:
    image: caddy:2.8-alpine
    profiles: [demo, full]
    restart: unless-stopped
    environment:
      SKYRADAR_DOMAIN: ${SKYRADAR_DOMAIN:?set SKYRADAR_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      frontend: { condition: service_healthy }
  redpanda:
    restart: unless-stopped
    ports: !reset []
  ingestion:
    ports: !reset []
  api:
    ports: !reset []
  frontend:
    ports: !reset []

volumes:
  caddy_data:
