[project]
name = "skyradar-assistant"
version = "0.1.0"
description = "Natural language assistant: guarded text-to-SQL over the DuckDB marts"
requires-python = ">=3.12,<3.13"
dependencies = [
    "skyradar-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "anthropic>=0.40",
    "sqlglot>=25",
    "duckdb>=1.1",
    "httpx>=0.27",
    "mcp>=1.2",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skyradar_assistant"]
