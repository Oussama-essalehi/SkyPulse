[project]
name = "skyradar-ml"
version = "0.1.0"
description = "Machine learning: flight reconstruction, anomalies, ETA, traffic forecasting"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "mlflow-skinny>=2.16",
    "boto3>=1.35",
    "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skyradar_ml"]
