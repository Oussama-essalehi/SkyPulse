# SkyRadar monitoring ("full" profile): every service exposes Prometheus metrics.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: ingestion
    static_configs: [{ targets: ["ingestion:9100"] }]
  - job_name: parquet-sink
    static_configs: [{ targets: ["parquet-sink:9101"] }]
  - job_name: anomaly-detector
    static_configs: [{ targets: ["anomaly-detector:9102"] }]
  - job_name: api
    metrics_path: /metrics/
    static_configs: [{ targets: ["api:8000"] }]
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs: [{ targets: ["redpanda:9644"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
