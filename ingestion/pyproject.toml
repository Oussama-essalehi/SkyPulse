[project]
name = "skyradar-ingestion"
version = "0.1.0"
description = "Polls ADS-B sources (OpenSky, replay) and publishes state vectors to Redpanda"
requires-python = ">=3.12,<3.13"
dependencies = [
    "skyradar-common[storage]",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "numpy>=1.26",
]

[project.scripts]
skyradar-ingestion = "skyradar_ingestion.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skyradar_ingestion"]
