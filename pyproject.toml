# Workspace root (virtual): each service is its own package under its folder.
[project]
name = "skyradar"
version = "0.1.0"
description = "SkyRadar - real-time global flight tracking platform (data + AI)"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "libs/common",
    "ingestion",
    "api",
    "streaming",
    "pipeline/dagster",
    "ml",
    "assistant",
]

[tool.uv.sources]
skyradar-common = { workspace = true }
skyradar-ingestion = { workspace = true }
skyradar-api = { workspace = true }
skyradar-streaming = { workspace = true }
skyradar-orchestration = { workspace = true }
skyradar-ml = { workspace = true }
skyradar-assistant = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "pre-commit>=3.8",
    "websockets>=13",
    "pandas-stubs",
    "types-requests",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["frontend", "pipeline/dbt/target", "pipeline/dbt/dbt_packages"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = [
    "skyradar_common", "skyradar_ingestion", "skyradar_api", "skyradar_streaming",
    "skyradar_orchestration", "skyradar_ml", "skyradar_assistant",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["tests/", "build/"]

[[tool.mypy.overrides]]
module = ["skyradar_orchestration.*", "skyradar_ml.*"]
disallow_untyped_decorators = false
disallow_subclassing_any = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires the docker compose stack (make up-demo)"]
addopts = "-m 'not integration' --import-mode=importlib"
testpaths = ["libs/common/tests", "ingestion/tests", "api/tests", "streaming/tests", "ml/tests", "assistant/tests", "pipeline/dagster/tests", "tests"]
